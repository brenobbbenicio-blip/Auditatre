name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalação (sem dependências do Drive)
        run: pip install -e ".[dev]"
      - name: Guardião LGPD (CPF não mascarado em arquivos versionados)
        run: python tools/lgpd_scan.py
      - name: Testes (sem rede, sem credenciais Google)
        run: python -m pytest
